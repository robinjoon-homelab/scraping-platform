<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{ui/layout :: head('계획 설정')}"></head>
<body th:replace="~{ui/layout :: shell('plans', ~{::content})}">
<section th:fragment="content" class="app-stack">
<p class="app-eyebrow">COLLECTION / OPERATIONS</p>
<h1>계획 설정</h1>
<p th:replace="~{ui/layout :: notice(${notice}, false)}"></p>
<p th:replace="~{ui/layout :: notice(${noticeError}, true)}"></p>
<a th:if="${plan == null}" th:href="@{/admin/sources}">다른 출처 선택</a><p class="ui-muted">HTTP JSON 응답 한 묶음이 레코드 하나입니다. 개별 기사 추출과 요약은 하지 않습니다. 시각은 UTC ISO-8601 형식입니다.</p>
<p th:if="${#lists.isEmpty(sources)}">출처 선택은 <a th:href="@{/admin/sources}">출처 관리</a>에서 할 수 있습니다.</p>
<form th:if="${!#lists.isEmpty(sources)}" th:action="${plan == null} ? @{/admin/plans} : @{/admin/plans/{id}(id=${plan.id})}" th:object="${form}" method="post" class="ui-panel app-stack">
<input th:if="${plan != null}" type="hidden" name="version" th:value="${plan.version}">
<div class="ui-field"><label for="name">계획 이름</label><input class="ui-input" id="name" name="name" type="text" th:value="*{name}" maxlength="200" required></div><div class="ui-field"><label for="sourceId">출처</label><select class="ui-input" id="sourceId" name="sourceId" required><option th:each="source : ${sources}" th:value="${source.id}" th:text="${source.name}"></option></select></div><div class="ui-field"><label for="resource">대상 경로</label><input class="ui-input" id="resource" name="resource" type="text" th:value="*{resource}" maxlength="2048" placeholder="/data" required></div><div class="ui-field"><label for="parameters">매개변수, 줄마다 이름=값</label><textarea class="ui-input" id="parameters" name="parameters" rows="4" maxlength="110000" th:text="*{parameters}"></textarea></div><div class="ui-field"><label for="everySeconds">실행 간격, 초 (60~31536000)</label><input class="ui-input" id="everySeconds" name="everySeconds" type="number" th:value="*{everySeconds}" min="60" max="31536000" required></div><div class="ui-field"><label for="anchorAt">기준 시각, UTC</label><input class="ui-input" id="anchorAt" name="anchorAt" type="text" th:value="*{anchorAt}" required></div><button class="ui-button ui-button-primary" type="submit">계획 저장</button></form>
<section th:if="${plan != null}" class="ui-panel app-stack"><h2>실행 제어</h2><p th:text="${executable ? '실행 가능한 설정입니다.' : '실행할 수 없습니다. 설정을 확인하세요.'}"></p><p th:each="issue : ${issues}" th:text="${issue}"></p>
<p>수정 버전 <span th:text="${plan.version}"></span>, 다음 실행 <span th:text="${plan.nextRun}"></span></p>
<div class="app-actions"><form th:action="@{/admin/plans/{id}/enabled(id=${plan.id})}" method="post"><input type="hidden" name="version" th:value="${plan.version}"><input type="hidden" name="enabled" th:value="${!plan.enabled}"><button class="ui-button" type="submit" th:unless="${!plan.enabled and !executable}" th:text="${plan.enabled ? '중지' : '활성화 / 재개'}"></button><button class="ui-button" type="submit" th:if="${!plan.enabled and !executable}" disabled th:text="${plan.enabled ? '중지' : '활성화 / 재개'}"></button></form>
<form th:action="@{/admin/plans/{id}/run(id=${plan.id})}" method="post"><input type="hidden" name="version" th:value="${plan.version}"><input type="hidden" name="requestKey" th:value="${requestKey}"><button class="ui-button ui-button-primary" type="submit" th:unless="${!executable}">즉시 실행</button><button class="ui-button ui-button-primary" type="submit" th:if="${!executable}" disabled>즉시 실행</button></form>
<form th:action="@{/admin/plans/{id}/preview(id=${plan.id})}" method="post"><button class="ui-button" type="submit" th:unless="${!executable}">샘플 미리보기</button><button class="ui-button" type="submit" th:if="${!executable}" disabled>샘플 미리보기</button></form></div>
<p class="ui-muted">중지해도 실행 중인 작업은 완료될 수 있습니다. 즉시 실행 요청의 재전송은 같은 요청 키로 중복 생성을 막습니다.</p>
<div class="app-actions"><a th:href="@{/admin/plans/{id}/runs(id=${plan.id})}">실행 이력</a><a th:href="@{/admin/plans/{id}/export(id=${plan.id})}">내보내기 관리</a></div></section>
<section th:if="${preview != null}" class="ui-panel app-stack"><h2>미리보기 결과</h2><p th:if="${#lists.isEmpty(preview)}">샘플 레코드가 없습니다.</p><pre th:each="payload : ${preview}" th:text="${payload}"></pre></section>
</section></body></html>
