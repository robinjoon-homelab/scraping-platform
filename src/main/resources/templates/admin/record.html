<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{ui/layout :: head('레코드 상세')}"></head>
<body th:replace="~{ui/layout :: shell('plans', ~{::content})}">
<section th:fragment="content" class="app-stack">
<p class="app-eyebrow">COLLECTION / OPERATIONS</p>
<h1>레코드 상세</h1>
<p th:replace="~{ui/layout :: notice(${notice}, false)}"></p>
<p th:replace="~{ui/layout :: notice(${noticeError}, true)}"></p>
<section class="ui-panel app-stack"><h2>출처와 원본 식별</h2><p th:text="${record.id}"></p><dl><dt>원천 키</dt><dd th:text="${record.key}"></dd><dt>내용 해시 SHA-256</dt><dd th:text="${record.hash}"></dd><dt>스키마</dt><dd th:text="${record.schema}"></dd></dl><p th:each="line : ${record.provenance}" th:text="${line}"></p></section><section class="ui-panel app-stack"><h2>최소 가공 본문</h2><pre th:text="${record.payload}"></pre></section>
</section></body></html>
