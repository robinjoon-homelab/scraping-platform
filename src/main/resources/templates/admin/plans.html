<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{ui/layout :: head('수집 계획')}"></head>
<body th:replace="~{ui/layout :: shell('plans', ~{::content})}">
<section th:fragment="content" class="app-stack">
<p class="app-eyebrow">COLLECTION / OPERATIONS</p>
<h1>수집 계획</h1>
<p th:replace="~{ui/layout :: notice(${notice}, false)}"></p>
<p th:replace="~{ui/layout :: notice(${noticeError}, true)}"></p>
<p class="ui-muted">원천 설정부터 실행, 레코드 확인, 인증된 내보내기까지 관리합니다.</p><div class="app-actions"><a class="ui-button ui-button-primary" th:href="@{/admin/plans/new}">새 계획</a><a th:href="@{/admin/sources}">출처 관리</a></div>
<th:block th:if="${#lists.isEmpty(plans)}"><div th:replace="~{ui/layout :: emptyState('수집 계획이 없습니다', '출처를 등록하고 새 계획에서 대상과 주기를 지정하세요.')}"></div></th:block>
<section th:each="plan : ${plans}" class="ui-panel app-stack"><h2><a th:href="@{/admin/plans/{id}(id=${plan.id})}" th:text="${plan.name}"></a></h2><p th:replace="~{ui/layout :: badge(${plan.enabled ? '활성' : '중지'}, ${plan.enabled ? 'success' : 'warning'})}"></p><p>다음 실행 <span th:text="${plan.nextRun}"></span></p><div class="app-actions"><a th:href="@{/admin/plans/{id}/runs(id=${plan.id})}">실행 이력</a><a th:href="@{/admin/plans/{id}/export(id=${plan.id})}">내보내기</a></div></section><nav class="app-actions" aria-label="목록 페이지"><a th:if="${offset > 0}" th:href="@{/admin/plans(offset=${T(java.lang.Math).max(0, offset - 20)})}">이전 20개</a><a th:if="${#lists.size(plans) == 20}" th:href="@{/admin/plans(offset=${offset + 20})}">다음 20개</a></nav>
</section></body></html>
